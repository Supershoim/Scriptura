name: Build Scriptura.html

# Next to the site (pages.yml, https://supershoim.github.io/Scriptura/), each push builds the single-file app
# and attaches it to the release "latest", to download and open offline on any device.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build.mjs
      - name: Attach to the release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        # Recreated rather than updated: replacing only the file would leave the tag, the date and the commit
        # shown on the release page at the first build. The download link stays the same.
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/Scriptura.html --target "$GITHUB_SHA" --title "Scriptura (ultima versiune)" \
            --notes "Construită automat din ${GITHUB_SHA::7} ($(git log -1 --format=%s)), $(TZ=Europe/Bucharest date '+%d.%m.%Y %H:%M'). Descarcă Scriptura.html și deschide-l în browser."
